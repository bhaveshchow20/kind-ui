name: Bug report
description: Report a reproducible, non-sensitive problem
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: "For security concerns, follow SECURITY.md. Do not include secrets or private data."
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include exact steps and a small example where relevant.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Commit, Node/npm versions, and operating system
    validations:
      required: true
