name: Focused proposal
description: Discuss a concrete need before implementation
title: "Proposal: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Consumer need
      description: What problem are you solving, and for whom?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Smallest useful change
      description: Explain alternatives and any public API or dependency impact.
    validations:
      required: true
