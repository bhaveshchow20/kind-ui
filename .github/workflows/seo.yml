name: SEO
on:
  pull_request:
    paths: ["apps/analytics.mjs", "apps/indexing.mjs", "apps/seo.mjs", "apps/showcase/**", "packages/charts/**", "scripts/indexing*", "scripts/analytics.test.mjs", "package.json", "package-lock.json", "tsconfig.base.json", ".github/workflows/seo.yml"]
  push:
    branches: [main]
    paths: ["apps/analytics.mjs", "apps/indexing.mjs", "apps/seo.mjs", "apps/showcase/**", "packages/charts/**", "scripts/indexing*", "scripts/analytics.test.mjs", "package.json", "package-lock.json", "tsconfig.base.json", ".github/workflows/seo.yml"]
permissions:
  contents: read
concurrency:
  group: seo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  showcase:
    name: "Homepage SEO · ${{ matrix.deployment }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - deployment: preview
            base_path: ""
          - deployment: production
            base_path: /charts
    env:
      KIND_UI_DEPLOYMENT_ENV: ${{ matrix.deployment }}
      NEXT_PUBLIC_SHOWCASE_BASE_PATH: ${{ matrix.base_path }}
      NEXT_PUBLIC_DOCS_URL: https://kindui.dev/charts/docs/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/showcase/package-lock.json
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: apps/showcase
      - run: npm run build
        working-directory: apps/showcase
      - run: npm exec playwright install -- --with-deps chromium
      - name: Check invisible analytics and production-only contracts
        run: node --test scripts/analytics.test.mjs
      - run: npm run test:browser -- tests/routes.spec.ts
        working-directory: apps/showcase
      - name: Check hero flow, fonts, and reduced motion
        run: npm run test:browser -- tests/headline-layout.spec.ts tests/headline-font.spec.ts --project=chromium
        working-directory: apps/showcase
      - name: Retain continuous hero motion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homepage-motion-${{ matrix.deployment }}
          path: apps/showcase/test-results/
          if-no-files-found: warn
          retention-days: 14
