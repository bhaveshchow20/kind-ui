name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: "Changed paths"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      browsers: ${{ steps.paths.outputs.browsers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - id: paths
        run: node scripts/ci-paths.mjs
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  fast:
    name: "Lint, types & unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm audit --audit-level=high --include=dev
      - name: Lint and CI/release contracts
        run: npm run check:preflight
      - run: npm run typecheck
      - run: npm run test:unit
  packed:
    name: "Packed package"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      # All isolated tarball installs, both strict resolution modes, component
      # re-tests, production builds, Next SSR, Tailwind and Lucide remain here.
      - run: npm run check:packed
        env:
          KIND_UI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          KIND_UI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Retain the installed and tested package candidate and browser fixtures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: charts-browser-fixtures
          path: |
            artifacts/package/
            artifacts/packed-*/
            artifacts/line-integrations/
            examples/chart/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Retain integration build failure evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-build-evidence
          path: artifacts/line-integrations/next-build.log
          if-no-files-found: warn
          retention-days: 14
  playwright:
    name: "Browser tests · shard ${{ matrix.shard }}/4"
    needs: [changes, packed]
    if: needs.changes.outputs.browsers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: charts-browser-fixtures
          path: .
      - id: playwright-version
        run: echo "version=$(node -p 'require("./node_modules/@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # pinned
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}-chromium
      # OS libraries are outside the browser cache and must exist on every VM.
      - run: npm exec playwright install-deps -- chromium
      - run: npm exec playwright install -- chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npm run check:browsers -- --shard=${{ matrix.shard }}/4
      - name: Retain all browser evidence for this shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: chart-screenshots-shard-${{ matrix.shard }}
          path: |
            artifacts/chart-tests/
            artifacts/composition-tests/
            artifacts/configured-line-tests/
            artifacts/line-integration-tests/
            artifacts/line-integrations/next-build.log
          if-no-files-found: error
          retention-days: 14
  # The required completion check fails closed on every incomplete prerequisite.
  check:
    name: All checks
    needs: [changes, fast, packed, playwright]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          test "$CHANGES" = success
          test "$FAST" = success
          test "$PACKED" = success
          if [ "$RUN_BROWSERS" = true ]; then
            test "$BROWSERS" = success
          else
            test "$RUN_BROWSERS" = false
            test "$BROWSERS" = skipped
          fi
        env:
          CHANGES: ${{ needs.changes.result }}
          FAST: ${{ needs.fast.result }}
          PACKED: ${{ needs.packed.result }}
          RUN_BROWSERS: ${{ needs.changes.outputs.browsers }}
          BROWSERS: ${{ needs.playwright.result }}
