name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # This temporary diagnostic branch is never merged; it runs one targeted consumer instead.
    if: github.head_ref != 'diagnostics/heatmap-escape-linux'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm audit --audit-level=high --include=dev
      - run: npm exec playwright install -- --with-deps chromium
      - run: npm run check
        env:
          KIND_UI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          KIND_UI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Retain the installed and tested package candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: charts-package-node-${{ matrix.node }}
          path: |
            artifacts/package/
            artifacts/line-integrations/evidence.json
            artifacts/line-integrations/next-build.log
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: chart-screenshots-node-${{ matrix.node }}
          path: |
            artifacts/chart-tests/
            artifacts/composition-tests/
            artifacts/configured-line-tests/
            artifacts/line-integration-tests/
            artifacts/line-integrations/next-build.log
          if-no-files-found: error
          retention-days: 14
