name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recover-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Recover only the two exact Node 24 failure traces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import io, json, os, urllib.request, urllib.error, zipfile
          from pathlib import Path
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          request = urllib.request.Request(
              'https://api.github.com/repos/bhaveshchow20/kind-ui/actions/artifacts/11255647817/zip',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json'})
          try:
              urllib.request.build_opener(NoRedirect).open(request)
              raise RuntimeError('Expected artifact redirect')
          except urllib.error.HTTPError as error:
              if error.code != 302:
                  raise
              location = error.headers['Location']
          with urllib.request.urlopen(location) as response:
              archive = zipfile.ZipFile(io.BytesIO(response.read()))
          count = 0
          for entry in archive.infolist():
              parts = Path(entry.filename).parts
              if any(part.endswith('-repeat3') or part.endswith('-repeat32') for part in parts):
                  archive.extract(entry, 'recovered')
                  count += 1
          if count == 0:
              raise RuntimeError('Failure trace paths were not found')
          print('Recovered', count, 'files from the exact failed diagnostic artifact')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exact-node24-failure-traces
          path: recovered/
          if-no-files-found: error
          retention-days: 14
