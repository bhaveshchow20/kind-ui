name: Docs
on:
  pull_request:
    paths: ["apps/docs/**", "packages/charts/**", "scripts/**", "package.json", "package-lock.json", "tsconfig.base.json", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["apps/docs/**", "packages/charts/**", "scripts/**", "package.json", "package-lock.json", "tsconfig.base.json", ".github/workflows/docs.yml"]
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/docs/package-lock.json
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm audit --audit-level=high --include=dev
      - run: node apps/docs/scripts/verify-pinned-package.mjs
      - run: npm ci
        working-directory: apps/docs
      - run: npm audit --audit-level=high --include=dev
        working-directory: apps/docs
      - run: |
          mkdir -p artifacts
          npm run generate
          npm run build
          npm run check
        working-directory: apps/docs
        env:
          KIND_DOCS_ORIGIN: https://kind-ui-charts-docs.angrypirate20.chatgpt.site
      - name: Retain the built docs site and generated browser fixtures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-browser-fixtures
          path: |
            apps/docs/out/
            apps/docs/generated/
            apps/docs/public/
          if-no-files-found: error
          retention-days: 14
  consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/docs/package-lock.json
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm audit --audit-level=high --include=dev
      - run: node apps/docs/scripts/verify-pinned-package.mjs
      - run: npm ci
        working-directory: apps/docs
      - run: npm audit --audit-level=high --include=dev
        working-directory: apps/docs
      - name: Check copied consumers and every variant in this shard
        run: |
          mkdir -p artifacts
          npm run generate
          if npm run check:consumers -- --shard=${{ matrix.shard }}/4 > artifacts/consumers.log 2>&1; then
            tail -n 12 artifacts/consumers.log
          else
            tail -n 100 artifacts/consumers.log
            exit 1
          fi
        working-directory: apps/docs
      - name: Retain strict consumer evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: docs-consumer-evidence-shard-${{ matrix.shard }}
          path: |
            apps/docs/artifacts/consumers.log
            apps/docs/artifacts/consumer-results*.json
          if-no-files-found: error
          retention-days: 14
  browsers:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [general, polar, advanced, cartesian]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/docs/package-lock.json
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm audit --audit-level=high --include=dev
      - run: node apps/docs/scripts/verify-pinned-package.mjs
      - run: npm ci
        working-directory: apps/docs
      - run: npm audit --audit-level=high --include=dev
        working-directory: apps/docs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-browser-fixtures
          # Both uploaded paths share apps/docs as their common ancestor.
          path: apps/docs
      - id: playwright-version
        run: echo "version=$(node -p 'require("./node_modules/@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # pinned
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}-chromium
      # OS libraries are outside the browser cache and must exist on every VM.
      - run: npm exec playwright install-deps -- chromium
      - run: npm exec playwright install -- chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npm run check:browser
        if: matrix.group == 'general'
        working-directory: apps/docs
      - run: node scripts/start-line-checks.mjs
        if: matrix.group == 'general'
        working-directory: apps/docs
      - run: node scripts/start-area-checks.mjs
        if: matrix.group == 'general'
        working-directory: apps/docs
      - name: Check pie documentation
        if: matrix.group == 'polar'
        run: |
          node --test scripts/pie-contract.test.mjs
          node scripts/start-pie-checks.mjs
        working-directory: apps/docs
      - name: Check radar documentation
        if: matrix.group == 'polar'
        run: |
          node scripts/start-radar-checks.mjs
        working-directory: apps/docs
      - name: Check sankey documentation
        if: matrix.group == 'advanced'
        run: |
          node --test scripts/check-sankey-source.test.mjs
          node scripts/start-sankey-checks.mjs
        working-directory: apps/docs
      - name: Check histogram documentation
        if: matrix.group == 'advanced'
        run: |
          node --test scripts/histogram-contract.test.mjs
          node scripts/check-histogram-consumers.mjs
          node scripts/start-histogram-checks.mjs
        working-directory: apps/docs
      - name: Check radial documentation
        if: matrix.group == 'polar'
        run: |
          set -o pipefail
          node scripts/start-radial-checks.mjs 2>&1 | tee artifacts/radial-check.log
        working-directory: apps/docs
      - name: Check waterfall documentation
        if: matrix.group == 'advanced'
        run: |
          node --test scripts/waterfall-contract.test.mjs
          node scripts/check-waterfall-consumers.mjs
          node scripts/start-waterfall-checks.mjs
        working-directory: apps/docs
      - name: Check box-plot documentation
        if: matrix.group == 'cartesian'
        run: |
          node scripts/check-box-plot-consumers.mjs
          node scripts/start-box-plot-checks.mjs
        working-directory: apps/docs
      - name: Check combo documentation
        if: matrix.group == 'cartesian'
        run: |
          node --test scripts/combo-contract.test.mjs
          node scripts/check-combo-consumers.mjs
          node scripts/start-combo-checks.mjs
        working-directory: apps/docs
      - name: Check scatter documentation
        if: matrix.group == 'cartesian'
        run: |
          node scripts/start-scatter-checks.mjs
        working-directory: apps/docs
      - name: Check bar documentation
        if: matrix.group == 'cartesian'
        run: |
          node scripts/start-bar-checks.mjs
        working-directory: apps/docs
      - name: Check heatmap documentation
        if: matrix.group == 'polar'
        run: |
          node --test scripts/heatmap-contract.test.mjs
          node scripts/check-heatmap-consumers.mjs
          node scripts/start-heatmap-checks.mjs
        working-directory: apps/docs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: docs-browser-verification-${{ matrix.group }}
          path: |
            apps/docs/artifacts/*.log
            apps/docs/artifacts/*-results.json
            apps/docs/artifacts/screenshots/*.png
            apps/docs/artifacts/pie/*.png
            apps/docs/artifacts/pie/*.json
            apps/docs/artifacts/radar/*.png
            apps/docs/artifacts/radar/*.json
            apps/docs/artifacts/sankey/*.png
            apps/docs/artifacts/sankey/*.json
            apps/docs/artifacts/radial/*.png
            apps/docs/artifacts/radial/*.json
            apps/docs/artifacts/waterfall/*.png
            apps/docs/artifacts/waterfall/*.json
            apps/docs/artifacts/box-plot/*.png
            apps/docs/artifacts/box-plot/*.json
            apps/docs/artifacts/combo-*.png
            apps/docs/artifacts/heatmap/*.png
            apps/docs/artifacts/heatmap/*.json
          if-no-files-found: warn
          retention-days: 14
  docs:
    needs: [build, consumers, browsers]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          test "$BUILD" = success
          test "$CONSUMERS" = success
          test "$BROWSERS" = success
        env:
          BUILD: ${{ needs.build.result }}
          CONSUMERS: ${{ needs.consumers.result }}
          BROWSERS: ${{ needs.browsers.result }}
