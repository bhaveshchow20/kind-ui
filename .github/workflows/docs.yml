name: Docs
on:
  pull_request:
    paths: ["apps/docs/**", "registry/**", "packages/charts/**", "scripts/**", "package.json", "package-lock.json", "tsconfig.base.json", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["apps/docs/**", "registry/**", "packages/charts/**", "scripts/**", "package.json", "package-lock.json", "tsconfig.base.json", ".github/workflows/docs.yml"]
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    name: "All docs checks"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm audit --audit-level=high --include=dev
      - id: playwright-version
        run: echo "version=$(node -p 'require("./node_modules/@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # pinned
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}-chromium
      # OS libraries are outside the browser cache and must exist on every VM.
      - run: npm exec playwright install-deps -- chromium
      - run: npm exec playwright install -- chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npm run test:docs
      - run: npm run build:docs
      - run: npm run check:docs
      - name: Build and check the docs under the kindui.dev mount
        run: npm run build:docs && npm run check:docs
        env:
          NEXT_PUBLIC_DOCS_BASE_PATH: /docs/charts
