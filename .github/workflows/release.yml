name: Release candidate
on:
  push:
    branches: [main]
    paths:
      - packages/charts/package.json
      - .changeset/release-version.json
  workflow_dispatch:
    inputs:
      version:
        description: Expected reviewed package version (private packages rehearse the pipeline)
        required: false
        default: ""
        type: string
      dist_tag:
        description: Proposed npm dist-tag, recorded for review
        required: true
        default: latest
        type: string
permissions:
  contents: read
concurrency:
  group: charts-release
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'bhaveshchow20/kind-ui' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      validate: ${{ steps.intent.outputs.validate }}
      publish: ${{ steps.intent.outputs.publish }}
      version: ${{ steps.intent.outputs.version }}
      tag: ${{ steps.intent.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global npm@11.9.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: intent
        name: Require a reviewed Changesets version transition before publication
        run: node scripts/release-intent.mjs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.dist_tag }}
  validate:
    needs: plan
    if: needs.plan.outputs.validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm audit --audit-level=high --include=dev
      - run: npm exec playwright install -- --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: charts-release-${{ github.run_attempt }}-node-22
          path: |
            artifacts/package/
            artifacts/line-integrations/evidence.json
            artifacts/line-integrations/next-build.log
          if-no-files-found: error
          retention-days: 14
      - name: Retain browser failure evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: charts-release-evidence-${{ github.run_attempt }}-node-22
          path: |
            artifacts/chart-tests/
            artifacts/composition-tests/
            artifacts/configured-line-tests/
            artifacts/line-integration-tests/
            artifacts/line-integrations/next-build.log
          if-no-files-found: warn
          retention-days: 14
  verify:
    needs: [plan, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      filename: ${{ steps.candidate.outputs.filename }}
      sha256: ${{ steps.candidate.outputs.sha256 }}
      publishable: ${{ steps.candidate.outputs.publishable }}
      integrity: ${{ steps.candidate.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: charts-release-${{ github.run_attempt }}-node-22
          path: artifacts/release-candidate
      # semver is pinned in the development lockfile; do not run install scripts.
      # Candidate bytes come exclusively from the downloaded artifact.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: candidate
        run: node scripts/verify-release-artifact.mjs artifacts/release-candidate
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      - name: Check any existing registry version against the verified artifact
        run: node scripts/check-release-registry.mjs
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_INTEGRITY: ${{ steps.candidate.outputs.integrity }}
  publish:
    # Publication is limited to the reviewed version transition and verified public artifact.
    if: >-
      github.repository == 'bhaveshchow20/kind-ui' &&
      github.ref == 'refs/heads/main' &&
      needs.plan.outputs.publish == 'true' &&
      needs.verify.outputs.publishable == 'true'
    needs: [plan, verify]
    permissions:
      contents: read
      id-token: write
    environment: npm-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.9.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: charts-release-${{ github.run_attempt }}-node-22
          path: artifacts/release-candidate
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/verify-release-artifact.mjs artifacts/release-candidate --require-public
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA256: ${{ needs.verify.outputs.sha256 }}
      - id: registry
        name: Recheck public version and integrity before the publish command
        run: node scripts/check-release-registry.mjs
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_INTEGRITY: ${{ needs.verify.outputs.integrity }}
      - name: Publish the exact verified tarball, without lifecycle repacking
        if: steps.registry.outputs.unpublished == 'true'
        run: npm publish "./artifacts/release-candidate/package/$CANDIDATE_FILENAME" --ignore-scripts --access public --tag "$DIST_TAG" --registry=https://registry.npmjs.org
        env:
          CANDIDATE_FILENAME: ${{ needs.verify.outputs.filename }}
          DIST_TAG: ${{ needs.plan.outputs.tag }}
      - name: Verify public integrity and latest after publication
        run: node scripts/check-release-registry.mjs --verify-published
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_INTEGRITY: ${{ needs.verify.outputs.integrity }}
  github-release:
    needs: [plan, verify, publish]
    if: needs.publish.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Record the published version and verified checksums on GitHub
        run: node scripts/github-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_FILENAME: ${{ needs.verify.outputs.filename }}
          RELEASE_SHA256: ${{ needs.verify.outputs.sha256 }}
          RELEASE_INTEGRITY: ${{ needs.verify.outputs.integrity }}
