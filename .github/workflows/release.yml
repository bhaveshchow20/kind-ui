name: Release candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: Expected reviewed package version (private packages rehearse the pipeline)
        required: true
        default: 0.1.1
        type: string
      dist_tag:
        description: Proposed npm dist-tag, recorded for review
        required: true
        default: latest
        type: string
permissions:
  contents: read
concurrency:
  group: charts-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm audit --audit-level=high --include=dev
      - run: npm run release:status
      - id: playwright-version
        run: echo "version=$(node -p 'require("./node_modules/@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # pinned
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}-chromium
      # OS libraries are outside the browser cache and must exist on every VM.
      - run: npm exec playwright install-deps -- chromium
      - run: npm exec playwright install -- chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npm run check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: charts-release-${{ github.run_attempt }}-node-22
          path: |
            artifacts/package/
            artifacts/line-integrations/evidence.json
            artifacts/line-integrations/next-build.log
          if-no-files-found: error
          retention-days: 14
      - name: Retain browser failure evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: charts-release-evidence-${{ github.run_attempt }}-node-22
          path: |
            artifacts/chart-tests/
            artifacts/composition-tests/
            artifacts/configured-line-tests/
            artifacts/line-integration-tests/
            artifacts/line-integrations/next-build.log
          if-no-files-found: warn
          retention-days: 14
  verify:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      filename: ${{ steps.candidate.outputs.filename }}
      sha256: ${{ steps.candidate.outputs.sha256 }}
      publishable: ${{ steps.candidate.outputs.publishable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: charts-release-${{ github.run_attempt }}-node-22
          path: artifacts/release-candidate
      # semver is pinned in the development lockfile; do not run install scripts.
      # Candidate bytes come exclusively from the downloaded artifact.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: candidate
        run: node scripts/verify-release-artifact.mjs artifacts/release-candidate
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.dist_tag }}
  publish:
    # Owner-approved activation must add only this job's OIDC permission and
    # protected npm-release environment. Neither is declared/granted here.
    if: ${{ false }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global npm@11.9.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: charts-release-${{ github.run_attempt }}-node-22
          path: artifacts/release-candidate
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/verify-release-artifact.mjs artifacts/release-candidate --require-public
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.dist_tag }}
          RELEASE_SHA256: ${{ needs.verify.outputs.sha256 }}
      - name: Publish the exact verified tarball, without lifecycle repacking
        run: npm publish "./artifacts/release-candidate/package/$CANDIDATE_FILENAME" --ignore-scripts --access public --tag "$DIST_TAG" --registry=https://registry.npmjs.org
        env:
          CANDIDATE_FILENAME: ${{ needs.verify.outputs.filename }}
          DIST_TAG: ${{ inputs.dist_tag }}
