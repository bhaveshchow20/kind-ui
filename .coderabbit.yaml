# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  request_changes_workflow: false
  high_level_summary_in_walkthrough: true
  auto_apply_labels: false
  auto_assign_reviewers: false
  slop_detection:
    enabled: false
  auto_review:
    enabled: true
    drafts: true
    base_branches: [".*"]
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    ignore_title_keywords: []
    ignore_usernames: []
    labels: []
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    custom: []
  post_merge_actions: []
chat:
  auto_reply: false
knowledge_base:
  code_guidelines:
    enabled: true
issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false
